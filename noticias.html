<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Notícias</title>

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    .loading {
      text-align: center;
      padding: 40px;
      color: cyan;
    }

    .noticia-completa {
      max-width: 900px;
      margin: auto;
    }

    .noticia-completa img {
      width: 100%;
      border-radius: 15px;
      margin: 20px 0;
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      background: cyan;
      color: black;
      border-radius: 20px;
      font-size: 12px;
    }

    .btn-voltar {
      display: inline-block;
      margin: 20px 0;
      padding: 10px 15px;
      background: transparent;
      border: 1px solid cyan;
      color: cyan;
      cursor: pointer;
      border-radius: 10px;
    }

    .btn-voltar:hover {
      background: cyan;
      color: black;
    }
  </style>

</head>

<body>

<!-- NAV -->
<nav>
  <div class="logo">TECH NEWS</div>

  <ul>
    <li><a href="index.html">Início</a></li>
    <li><a href="noticias.html">Notícias</a></li>
    <li><a href="sobre.html">Sobre</a></li>
    <li><a href="privacidade.html">Privacidade</a></li>
    <li><a href="contacto.html">Contacto</a></li>
  </ul>
</nav>

<section class="news-page">

  <div id="news-container" class="news-container">
    <div class="loading">A carregar notícias...</div>
  </div>

</section>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

let todasNoticias = [];

/* =========================
   CARREGAR LISTA
========================= */
async function carregarNoticias() {

  const { data, error } = await supabaseClient
    .from("noticias")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    document.getElementById("news-container").innerHTML =
      "<p>Erro ao carregar notícias</p>";
    return;
  }

  todasNoticias = data;
  renderNoticias(data);
}

/* =========================
   DETALHE NOTÍCIA
========================= */
async function carregarNoticiaIndividual(id) {

  const { data, error } = await supabaseClient
    .from("noticias")
    .select("*")
    .eq("id", id)
    .single();

  if (error || !data) {
    document.getElementById("news-container").innerHTML =
      "<p>Notícia não encontrada</p>";
    return;
  }

  document.getElementById("news-container").innerHTML = `
    <div class="noticia-completa">

      <button class="btn-voltar" onclick="voltar()">← Voltar</button>

      <span class="badge">${data.categoria}</span>

      <h1>${data.titulo}</h1>

      <img src="${data.imagem}">

      <p>${data.resumo || ""}</p>

      <hr>

      <h2>Mais notícias desta categoria</h2>

      <div id="sugestoes" class="news-container"></div>

    </div>
  `;

  carregarSugestoes(data.categoria, data.id);
}

/* =========================
   SUGESTÕES MELHORADAS
========================= */
async function carregarSugestoes(categoria, idAtual) {

  const { data } = await supabaseClient
    .from("noticias")
    .select("*")
    .eq("categoria", categoria)
    .neq("id", idAtual)
    .limit(4);

  const container = document.getElementById("sugestoes");

  if (!container) return;

  container.innerHTML = "";

  data.forEach(n => {

    container.innerHTML += `
      <div class="card" onclick="abrirNoticia(${n.id})">

        <img src="${n.imagem}">

        <div class="card-content">

          <span>${n.categoria}</span>
          <h3>${n.titulo}</h3>

        </div>

      </div>
    `;
  });
}

/* =========================
   LISTA NORMAL
========================= */
function renderNoticias(data) {

  const container = document.getElementById("news-container");

  container.innerHTML = "";

  data.forEach(n => {

    container.innerHTML += `
      <div class="card">

        <img src="${n.imagem}" onclick="abrirNoticia(${n.id})">

        <div class="card-content">

          <span>${n.categoria}</span>

          <h3>${n.titulo}</h3>

          <p>${n.resumo}</p>

        </div>

      </div>
    `;
  });
}

/* =========================
   FUNÇÕES AUXILIARES
========================= */
function filtrar(cat) {

  if (cat === "TODOS") {
    renderNoticias(todasNoticias);
  } else {
    renderNoticias(todasNoticias.filter(n => n.categoria === cat));
  }
}

function abrirNoticia(id) {
  window.location.href = `noticias.html?id=${id}`;
}

function voltar() {
  window.location.href = "noticias.html";
}

/* =========================
   INIT
========================= */
window.addEventListener("DOMContentLoaded", () => {

  if (id) {
    carregarNoticiaIndividual(id);
  } else {
    carregarNoticias();
  }

});

</script>

</body>
</html>
