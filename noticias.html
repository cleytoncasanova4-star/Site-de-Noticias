<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

let todasNoticias = [];

/* =========================
   CARREGAR LISTA
========================= */
async function carregarNoticias() {

  const { data, error } = await supabaseClient
    .from("noticias")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    document.getElementById("news-container").innerHTML =
      "<p>Erro ao carregar notícias</p>";
    return;
  }

  todasNoticias = data;
  renderNoticias(data);
}

/* =========================
   DETALHE NOTÍCIA
========================= */
async function carregarNoticiaIndividual(id) {

  const { data, error } = await supabaseClient
    .from("noticias")
    .select("*")
    .eq("id", id)
    .single();

  if (error || !data) {
    document.getElementById("news-container").innerHTML =
      "<p>Notícia não encontrada</p>";
    return;
  }
  await supabaseClient
  .from("noticias")
  .update({
    visualizacoes: (data.visualizacoes || 0) + 1
  })
  .eq("id", id);

  const vantagensHTML = data.vantagens
    ? data.vantagens
        .split("\n")
        .filter(v => v.trim())
        .map(v => `<li>${v}</li>`)
        .join("")
    : "";

  const desvantagensHTML = data.desvantagens
    ? data.desvantagens
        .split("\n")
        .filter(v => v.trim())
        .map(v => `<li>${v}</li>`)
        .join("")
    : "";

    const sugestoesHTML = data.sugestoes
  ? data.sugestoes
      .split("\n")
      .filter(v => v.trim())
      .map(v => `<li>${v}</li>`)
      .join("")
  : "";



  document.getElementById("news-container").innerHTML = `
<div class="noticia-completa">

  <button class="btn-voltar" onclick="voltar()">
    ← Voltar
  </button>

  <span class="badge">${data.categoria}</span>

  <h1>${data.titulo}</h1>

  <div class="noticia-meta">

    <span>
      👤 ${data.autor || "Tech News"}
    </span>

    <span>
      ⏱️ ${data.tempo_leitura || "5 min de leitura"}
    </span>
    <span>
      📅 ${new Date(data.created_at).toLocaleDateString("pt-PT")}
    </span>
    <span>
     👁️ ${data.visualizacoes || 0} visualizações
    </span>

  </div>

  <img src="${data.imagem}">

  <div class="texto-noticia">
    <p>${(data.resumo || "").replace(/\n/g, "<br>")}</p>
  </div>

  ${
    vantagensHTML
      ? `
      <div class="vantagens-box">
        <h3>✅ Vantagens</h3>
        <ul>
          ${vantagensHTML}
        </ul>
      </div>
    `
      : ""
  }

  ${
    desvantagensHTML
      ? `
      <div class="desvantagens-box">
        <h3>❌ Pontos de Atenção</h3>
        <ul>
          ${desvantagensHTML}
        </ul>
      </div>
    `
      : ""
  }

  ${
  sugestoesHTML
    ? `
    <div class="sugestoes-box">
      <h3>💡 Sugestões</h3>
      <ul>
        ${sugestoesHTML}
      </ul>
    </div>
    `
    : ""
}

  <hr>

  <h2>Mais notícias desta categoria</h2>

  <div id="sugestoes" class="news-container"></div>

</div>
`;

  carregarSugestoes(data.categoria, data.id);
}

/* =========================
   SUGESTÕES MELHORADAS
========================= */
async function carregarSugestoes(categoria, idAtual) {

  const { data } = await supabaseClient
    .from("noticias")
    .select("*")
    .eq("categoria", categoria)
    .neq("id", idAtual)
    .limit(4);

  const container = document.getElementById("sugestoes");

  if (!container) return;

  container.innerHTML = "";

  data.forEach(n => {

    container.innerHTML += `
      <div class="card" onclick="abrirNoticia(${n.id})">

        <img src="${n.imagem}">

        <div class="card-content">

          <span>${n.categoria}</span>
          <h3>${n.titulo}</h3>

        </div>

      </div>
    `;
  });
}

/* =========================
   LISTA NORMAL
========================= */
function renderNoticias(data) {

  const container = document.getElementById("news-container");
  container.innerHTML = "";

  data.forEach(n => {

    const cat = (n.categoria || "geral").toLowerCase();

    container.innerHTML += `
      <div class="card" data-category="${cat}">

        <img src="${n.imagem}" onclick="abrirNoticia(${n.id})">

        <div class="card-content">

          <span>${n.categoria}</span>

          <h3>${n.titulo}</h3>

          <p>${n.resumo || ""}</p>

          <button class="ler-mais-btn" onclick="abrirNoticia(${n.id})">
            Ver Notícia Completa
          </button>

        </div>

      </div>
    `;
  });
}

/* =========================
   FUNÇÕES AUXILIARES
========================= */
function filtrar(cat) {

  const container = document.getElementById("news-container");

  const filtradas = (cat === "all")
    ? todasNoticias
    : todasNoticias.filter(n =>
        (n.categoria || "").toLowerCase() === cat
      );

  renderNoticias(filtradas);
}

function abrirNoticia(id) {
  window.location.href = `noticias.html?id=${id}`;
}

function voltar() {
  window.location.href = "noticias.html";
}

/* =========================
   INIT
========================= */
window.addEventListener("DOMContentLoaded", () => {

  if (id) {
    carregarNoticiaIndividual(id);
  } else {
    carregarNoticias();
  }

});

</script>
