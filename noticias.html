<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Notícias | Tech News</title>

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    .loading {
      text-align: center;
      padding: 40px;
      color: cyan;
    }

    .noticia-completa {
      max-width: 900px;
      margin: auto;
    }

    .noticia-completa img {
      width: 100%;
      border-radius: 15px;
      margin: 20px 0;
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      background: cyan;
      color: #000;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 15px;
    }

    .btn-voltar {
      display: inline-block;
      margin: 20px 0;
      padding: 10px 18px;
      background: transparent;
      border: 1px solid cyan;
      color: cyan;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-voltar:hover {
      background: cyan;
      color: #000;
    }

    .noticia-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin: 15px 0;
      color: #999;
      font-size: 14px;
    }

    .texto-noticia {
      line-height: 1.8;
      margin: 25px 0;
    }

    .vantagens-box,
    .desvantagens-box,
    .sugestoes-box {
      margin: 25px 0;
      padding: 20px;
      border-radius: 12px;
      background: rgba(255,255,255,.05);
      border-left: 4px solid cyan;
    }

    .vantagens-box ul,
    .desvantagens-box ul,
    .sugestoes-box ul{
      padding-left:20px;
    }

  </style>

</head>

<body>

<nav>

<div class="logo">
TECH NEWS
</div>

<ul>

<li><a href="index.html">Início</a></li>
<li><a href="noticias.html">Notícias</a></li>
<li><a href="sobre.html">Sobre</a></li>
<li><a href="privacidade.html">Privacidade</a></li>
<li><a href="contacto.html">Contacto</a></li>

</ul>

</nav>

<section class="news-page">

<div class="filters">

<button onclick="filtrar('all')">
Todos
</button>

<button onclick="filtrar('ia')">
IA
</button>

<button onclick="filtrar('games')">
Games
</button>

<button onclick="filtrar('smartphones')">
Smartphones
</button>

</div>

<div id="news-container" class="news-container">

<div class="loading">
A carregar notícias...
</div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>

const params=new URLSearchParams(window.location.search);

const id=params.get("id");

let todasNoticias=[];

async function carregarNoticias() {

  const { data: noticias, error } = await supabaseClient
    .from("noticias")
    .select("*")
    .order("created_at", { ascending: false });

  console.log("DATA:", noticias);
  console.log("ERROR:", error);

  if (error) {
    document.getElementById("news-container").innerHTML =
      "<p>Erro ao carregar notícias</p>";
    return;
  }

  todasNoticias = noticias;

  renderNoticias(noticias);
}


async function carregarNoticiaIndividual(id){

const {data,error}=await supabaseClient

.from("noticias")

.select("*")

.eq("id",id)

.single();

if(error||!data){

document.getElementById("news-container").innerHTML="<p>Notícia não encontrada.</p>";

return;

}

await supabaseClient

.from("noticias")

.update({

visualizacoes:(data.visualizacoes||0)+1

})

.eq("id",id);

const vantagensHTML=data.vantagens?

data.vantagens

.split("\n")

.filter(v=>v.trim())

.map(v=>`<li>${v}</li>`)

.join(""):"";

const desvantagensHTML=data.desvantagens?

data.desvantagens

.split("\n")

.filter(v=>v.trim())

.map(v=>`<li>${v}</li>`)

.join(""):"";

const sugestoesHTML=data.sugestoes?

data.sugestoes

.split("\n")

.filter(v=>v.trim())

.map(v=>`<li>${v}</li>`)

.join(""):"";
document.getElementById("news-container").innerHTML = `

<div class="noticia-completa">

<button class="btn-voltar" onclick="voltar()">
← Voltar
</button>

<span class="badge">${data.categoria}</span>

<h1>${data.titulo}</h1>

<div class="noticia-meta">

<span>👤 ${data.autor || "Tech News"}</span>

<span>⏱️ ${data.tempo_leitura || "5 min de leitura"}</span>

<span>📅 ${new Date(data.created_at).toLocaleDateString("pt-PT")}</span>

<span>👁️ ${(data.visualizacoes || 0) + 1} visualizações</span>

</div>

<img src="${data.imagem}" alt="${data.titulo}">

<div class="texto-noticia">

<p>${(data.resumo || "").replace(/\n/g,"<br>")}</p>

</div>

${vantagensHTML ? `

<div class="vantagens-box">

<h3>✅ Vantagens</h3>

<ul>

${vantagensHTML}

</ul>

</div>

` : ""}

${desvantagensHTML ? `

<div class="desvantagens-box">

<h3>❌ Pontos de Atenção</h3>

<ul>

${desvantagensHTML}

</ul>

</div>

` : ""}

${sugestoesHTML ? `

<div class="sugestoes-box">

<h3>💡 Sugestões</h3>

<ul>

${sugestoesHTML}

</ul>

</div>

` : ""}

<hr>

<h2>Mais notícias desta categoria</h2>

<div id="sugestoes" class="news-container"></div>

</div>

`;

carregarSugestoes(data.categoria,data.id);

}

async function carregarSugestoes(categoria,idAtual){

const {data,error}=await supabaseClient

.from("noticias")

.select("*")

.eq("categoria",categoria)

.neq("id",idAtual)

.limit(4);

const container=document.getElementById("sugestoes");

if(!container) return;

container.innerHTML="";

if(error || !data || data.length===0){

container.innerHTML="<p>Nenhuma notícia relacionada.</p>";

return;

}

data.forEach(n=>{

container.innerHTML+=`

<div class="card" onclick="abrirNoticia(${n.id})">

<img src="${n.imagem}" alt="${n.titulo}">

<div class="card-content">

<span>${n.categoria}</span>

<h3>${n.titulo}</h3>

</div>

</div>

`;

});

}

function renderNoticias(data) {

  const container = document.getElementById("news-container");

  if (!container) return;

  container.innerHTML = "";

  // Se não houver notícias
  if (!data || data.length === 0) {
    container.innerHTML = `
      <p style="text-align:center; padding:40px; color:#999;">
        Nenhuma notícia encontrada.
      </p>
    `;
    return;
  }

  // Renderiza cards
  data.forEach((n) => {

    const categoria = (n.categoria || "geral").toLowerCase();

    container.innerHTML += `
      <div class="card" data-category="${categoria}">

        <img 
          src="${n.imagem}" 
          alt="${n.titulo}"
          onclick="abrirNoticia(${n.id})"
        >

        <div class="card-content">

          <span>${n.categoria || "Geral"}</span>

          <h3>${n.titulo}</h3>

          <p>
            ${(n.resumo || "").substring(0, 120)}...
          </p>

          <button class="ler-mais-btn" onclick="abrirNoticia(${n.id})">
            Ver Notícia Completa
          </button>

        </div>

      </div>
    `;
  });
}


function filtrar(categoria){

  const buttons = document.querySelectorAll(".filters button");

  buttons.forEach(btn => {

    btn.classList.remove("active");

    if(btn.textContent.trim().toLowerCase() === categoria ||
       (categoria === "all" && btn.textContent.trim().toLowerCase() === "todos")){

      btn.classList.add("active");

    }

  });

  const filtradas = categoria === "all"

    ? todasNoticias

    : todasNoticias.filter(n =>

        (n.categoria || "")

          .trim()

          .toLowerCase() === categoria

      );

  renderNoticias(filtradas);

}

function abrirNoticia(id){

  window.location.href = `noticias.html?id=${id}`;

}

function voltar(){

  window.location.href = "noticias.html";

}

window.addEventListener("DOMContentLoaded", () => {

  if(id){

    carregarNoticiaIndividual(id);

  }else{

    carregarNoticias();

  }

});

</script>

</body>

</html>
