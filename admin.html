<!DOCTYPE html>
<html lang="pt">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin</title>

  <link rel="stylesheet" href="style.css">

  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

</head>

<body>

  <!-- LOGIN -->
  <div
    class="login-box"
    id="login-box"
  >

    <h1>Admin Login</h1>

    <input
      type="password"
      id="senha"
      placeholder="Senha"
    >

    <button onclick="login()">
      Entrar
    </button>

  </div>

  <!-- PAINEL -->
  <section
    class="admin-page"
    id="admin-page"
    style="display:none;"
  >

    <div class="admin-box">

      <h1>Painel Admin</h1>

      <!-- FORM -->

      <input
        type="text"
        id="titulo"
        placeholder="Título"
      >

      <textarea
        id="resumo"
        placeholder="Resumo"
      ></textarea>

      <textarea
  id="vantagens"
  placeholder="Vantagens (uma por linha)"
></textarea>

<textarea
  id="desvantagens"
  placeholder="Desvantagens (uma por linha)"
></textarea>

<textarea
  id="sugestoes"
  placeholder="Sugestões ou recomendações (uma por linha)"
></textarea>

<input
  type="text"
  id="autor"
  placeholder="Nome do Autor"
>

<input
  type="text"
  id="tempoLeitura"
  placeholder="Ex: 5 min de leitura"
>
<label>
<input type="checkbox" id="destaque">
Destacar na Home
</label>

<label class="checkbox">
  <input type="checkbox" id="destaque">
  Notícia em Destaque
</label>

      <select id="categoria">

        <option value="">
          Categoria
        </option>

        <option value="IA">
          IA
        </option>

        <option value="Smartphones">
          Smartphones
        </option>

        <option value="Games">
          Games
        </option>
        
        <option value="Notícia">
          Notícia
        </option>

      </select>

      <!-- IMAGEM -->
      <input
        type="file"
        id="imagem"
        accept="image/*"
      >

      <button onclick="salvarNoticia()">
        Salvar Notícia
      </button>

    </div>

    <!-- LISTA -->
    <div
      id="admin-container"
      class="admin-container"
    ></div>

  </section>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase.js"></script>

  <script src="js/admin.js"></script>

</body>

</html>
